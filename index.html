<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HW Love Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Noto Sans SC',sans-serif;user-select:none}
#game{position:relative;width:100%;height:100%;max-width:1280px;max-height:720px;margin:auto;overflow:hidden;background:#0a0a18}
.layer{position:absolute;inset:0;transition:opacity .5s}
.hidden{opacity:0;pointer-events:none}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#1a1028,#0a0a18)}
#title h1{font-family:'Noto Serif SC',serif;font-size:48px;color:#ffcad4;letter-spacing:.12em;text-shadow:0 0 40px rgba(255,200,210,.4);margin-bottom:8px}
#title .sub{font-size:16px;color:rgba(200,180,200,.5);letter-spacing:.15em;margin-bottom:48px}
.btn{background:transparent;color:#ffd0dc;border:1.5px solid rgba(255,200,210,.4);padding:14px 52px;font-size:18px;font-family:inherit;letter-spacing:.1em;border-radius:6px;cursor:pointer;transition:all .4s}
.btn:hover{background:rgba(255,180,200,.12);border-color:rgba(255,200,210,.7);box-shadow:0 0 30px rgba(200,140,170,.25)}
#map{display:flex;align-items:center;justify-content:center;z-index:5;background:radial-gradient(ellipse at center,#141e2e,#080c16)}
#map-svg{width:90%;height:90%}
.land{fill:#1a2840;stroke:#3a5070;stroke-width:1.5}
.city{cursor:pointer;transition:transform .25s}
.city:hover{transform:scale(1.35)}
.city.pinned{transform:scale(1.4)}
.dot{fill:#ff4444;stroke:#fff;stroke-width:2}
.lbl{fill:#ff6b6b;font-size:15px;pointer-events:none}
.pulse{fill:none;stroke:#ff4444;stroke-width:2;opacity:.6;animation:p 2s ease-out infinite}
@keyframes p{0%{r:10;opacity:.8}100%{r:30;opacity:0}}
.overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(16,16,32,.95);border:1px solid rgba(255,200,210,.3);border-radius:12px;padding:28px 40px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay p{color:#e8d5e0;font-size:18px;margin-bottom:20px}
#dlg{display:flex;flex-direction:column;justify-content:flex-end;padding:0 40px 30px;z-index:2}
#tag{display:inline-block;background:#2d2d44;color:#ffccd5;font-size:16px;font-weight:700;padding:6px 28px;border-radius:8px 8px 0 0;letter-spacing:.05em;margin-bottom:-1px;opacity:0;transition:opacity .3s}
#tag.show{opacity:1}
#box{background:rgba(16,16,32,.92);border:1px solid rgba(255,200,210,.25);border-radius:0 10px 10px 10px;padding:20px 28px;min-height:130px;backdrop-filter:blur(12px);position:relative}
#txt{color:#e8e8f0;font-size:18px;line-height:1.8;min-height:54px}
#indicator{position:absolute;bottom:10px;right:20px;color:rgba(255,255,255,.5);font-size:13px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#end{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;background:rgba(0,0,0,.7)}
#end h2{font-family:'Noto Serif SC',serif;font-size:36px;color:#ffd0dc;margin-bottom:20px}
@media(max-width:768px){#title h1{font-size:32px}#txt{font-size:15px}#tag{font-size:14px;padding:4px 20px}#box{padding:14px 18px;min-height:110px}.btn{padding:10px 36px;font-size:16px}}
</style>
</head>
<body>
<div id="game">
  <div id="title" class="layer">
    <h1>菊厂恋爱物语</h1>
    <div class="sub">HW Love Story</div>
    <button class="btn" onclick="goMap()">开 始 游 戏</button>
  </div>
  <div id="map" class="layer hidden">
    <svg id="map-svg" viewBox="0 0 900 750">
      <polygon class="land" points="720,85 740,115 760,105 775,125 765,150 780,160 770,180 750,190 760,215 740,235 730,265 745,285 735,305 750,325 740,355 755,375 745,395 760,415 750,435 765,455 755,475 770,495 760,515 775,535 760,555 780,575 420,585 405,565 365,580 355,560 305,570 295,550 245,560 235,540 185,550 175,530 145,540 135,520 105,530 95,510 75,515 65,495 85,475 115,465 125,445 155,435 175,415 195,405 185,385 205,375 225,355 245,345 265,325 285,315 305,285 325,275 345,265 375,255 395,235 425,225 455,210 485,200 515,190 545,180 575,170 605,160 635,150 665,140 685,120 705,100 720,85"/>
      <circle cx="550" cy="175" r="10" fill="none" stroke="#ff4444" stroke-width="2" opacity=".6"/>
      <g class="city" onclick="pickCity('beijing')" transform="translate(550,175)">
        <circle cx="0" cy="0" r="8" fill="#ff4444" stroke="#fff" stroke-width="2"/>
        <text class="lbl" x="16" y="5">北京</text>
      </g>
      <g class="city" onclick="pickCity('shenzhen')" transform="translate(420,420)">
        <circle cx="0" cy="0" r="8" fill="#ff4444" stroke="#fff" stroke-width="2"/>
        <text class="lbl" x="16" y="5">深圳</text>
      </g>
    </svg>
    <div id="popup" class="overlay">
      <p id="popup-msg"></p>
      <button class="btn" onclick="goStory()" style="padding:10px 28px;font-size:15px;margin-right:8px">出发</button>
      <button class="btn" onclick="cancelCity()" style="padding:10px 28px;font-size:15px">再想想</button>
    </div>
  </div>
  <div id="dlg" class="layer hidden">
    <div id="tag"></div>
    <div id="box">
      <div id="txt"></div>
      <div id="indicator">&#x25BC; 点击继续</div>
    </div>
  </div>
  <div id="end" class="layer hidden">
    <h2>未完待续</h2>
    <button class="btn" onclick="backToMap()" style="padding:10px 36px;font-size:16px">返回地图</button>
  </div>
</div>
<script>
var E=function(id){return document.getElementById(id)}
var title=E('title'),map=E('map'),dlg=E('dlg'),box=E('box'),txt=E('txt')
var tag=E('tag'),ind=E('indicator'),popup=E('popup'),popupMsg=E('popup-msg'),end=E('end')
var city='',scene=0,line=0,typing=false,timer=null

var stories={
  beijing:{name:'嫣儿',title:'北京',lines:[
    {w:'',t:'高铁缓缓驶入北京南站，窗外的城市轮廓在晨光中逐渐清晰。'},
    {w:'',t:'松山湖的日子仿佛还在昨天，但新的篇章已经翻开。'},
    {w:'',t:'按照入职指引的地址，你拖着行李箱走进了北京的研发中心……'},
    {w:'???',t:'你就是新来的同事吧？'},
    {w:'',t:'一个扎着马尾的女孩从工位站起来，朝你挥了挥手。'},
    {w:'嫣儿',t:'你好呀，我叫嫣儿。以后就是同事了，多多关照~'},
  ]},
  shenzhen:{name:'虚叶',title:'深圳',lines:[
    {w:'',t:'飞机降落在宝安机场，潮湿的暖风扑面而来。'},
    {w:'',t:'深圳，这座永远在奔跑的城市，你深吸一口气，走向出口。'},
    {w:'',t:'研发大楼的灯还亮着，已是深夜十一点。'},
    {w:'???',t:'这么晚才到？'},
    {w:'',t:'一个戴着黑框眼镜的女生从茶水间走出来，手里端着咖啡。'},
    {w:'虚叶',t:'我叫虚叶，等你半天了。这边工位都给你收拾好了，先坐下歇会吧。'},
  ]}
}

function goMap(){title.classList.add('hidden');setTimeout(function(){map.classList.remove('hidden')},400)}
function pickCity(c){city=c;document.querySelectorAll('.city').forEach(function(e){e.classList.remove('pinned')});document.querySelector('[onclick="pickCity(''+c+'')"]').classList.add('pinned');popupMsg.textContent='出发去'+stories[c].title+'？';popup.classList.add('on')}
function cancelCity(){popup.classList.remove('on');document.querySelectorAll('.city').forEach(function(e){e.classList.remove('pinned')})}
function goStory(){popup.classList.remove('on');scene=0;line=0;typing=false;map.classList.add('hidden');dlg.classList.remove('hidden');nxt()}
function nxt(){var s=stories[city];if(line>=s.lines.length){fin();return}var l=s.lines[line];line++;if(l.w){tag.textContent=l.w;tag.classList.add('show')}else{tag.classList.remove('show')}ind.style.display='none';type(l.t,function(){ind.style.display='block'})}
function type(t,cb){typing=true;if(timer)clearTimeout(timer);txt.textContent='';var i=0;function tick(){if(i<t.length){txt.textContent+=t[i];i++;timer=setTimeout(tick,35)}else{typing=false;timer=null;if(cb)cb()}}tick()}
function fin(){dlg.classList.add('hidden');end.classList.remove('hidden')}
function backToMap(){end.classList.add('hidden');map.classList.remove('hidden');city='';scene=0;line=0}
box.addEventListener('click',function(){if(typing){typing=false;clearTimeout(timer);timer=null;return}nxt()})
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();box.click()}})
</script>
</body>
</html>
