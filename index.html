﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菊厂恋爱物语</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div id="game-container">
  <canvas id="bg-canvas"></canvas>
  <img id="char-image" class="character-image" src="" onerror="this.onerror=null; this.src='';" />
  
  <div id="title-screen" class="layer active">
    <h1>菊厂恋爱物语</h1>
    <div class="subtitle">HW Love Story</div>
    <button class="btn" id="start-btn">开 始 游 戏</button>
  </div>
  
  <div id="map-screen" class="layer">
    <div id="map-container"></div>
  </div>
  
  <div id="dialogue-box" class="layer">
    <div class="dialogue-wrapper">
      <div class="name-tag" id="name-tag"></div>
      <div class="dialogue-content">
        <div class="text" id="dialogue-text"></div>
        <div class="click-indicator" id="click-indicator">&#x25BC; 点击继续</div>
      </div>
    </div>
  </div>
  
  <div id="choices-layer"></div>
  
  <div id="ending-screen" class="layer">
    <h2 id="ending-title"></h2>
    <div class="ending-type" id="ending-type"></div>
    <div class="ending-text" id="ending-text"></div>
    <button class="btn" id="restart-btn">返回地图</button>
  </div>
  
  <div id="confirm-modal" class="layer">
    <div class="modal-content">
      <div class="modal-title">就职确认</div>
      <div class="modal-text" id="confirm-text"></div>
      <div class="modal-buttons">
        <button class="btn modal-btn" id="confirm-yes">是</button>
        <button class="btn modal-btn" id="confirm-no">否</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core/dom.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/sceneManager.js"></script>
<script src="js/core/typewriter.js"></script>
<script src="js/renderers/background.js"></script>
<script src="js/renderers/character.js"></script>
<script src="js/renderers/map.js"></script>
<script src="js/data/story.js"></script>
<script src="js/game/gameManager.js"></script>
<script src="js/main.js"></script>
</body>
</html>
