<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HW Love Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Noto Sans SC',sans-serif;user-select:none}
#game{position:relative;width:100%;height:100%;max-width:1280px;max-height:720px;margin:auto;overflow:hidden;background:#0a0a18}
.l{position:absolute;inset:0;transition:opacity .5s}
.h{opacity:0;pointer-events:none}
#t{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#1a1028,#0a0a18)}
#t h1{font-family:'Noto Serif SC',serif;font-size:48px;color:#ffcad4;letter-spacing:.12em;text-shadow:0 0 40px rgba(255,200,210,.4);margin-bottom:8px}
#t .sub{font-size:16px;color:rgba(200,180,200,.5);letter-spacing:.15em;margin-bottom:48px}
.btn{background:transparent;color:#ffd0dc;border:1.5px solid rgba(255,200,210,.4);padding:14px 52px;font-size:18px;font-family:inherit;letter-spacing:.1em;border-radius:6px;cursor:pointer;transition:all .4s}
.btn:hover{background:rgba(255,180,200,.12);border-color:rgba(255,200,210,.7);box-shadow:0 0 30px rgba(200,140,170,.25)}
#m{z-index:5}
.ov{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(16,16,32,.95);border:1px solid rgba(255,200,210,.3);border-radius:12px;padding:28px 40px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.ov p{color:#e8d5e0;font-size:18px;margin-bottom:20px}
#d{display:flex;flex-direction:column;justify-content:flex-end;padding:0 40px 30px;z-index:2}
#tg{display:inline-block;background:#2d2d44;color:#ffccd5;font-size:16px;font-weight:700;padding:6px 28px;border-radius:8px 8px 0 0;letter-spacing:.05em;margin-bottom:-1px;opacity:0;transition:opacity .3s}
#tg.s{opacity:1}
#bx{background:rgba(16,16,32,.92);border:1px solid rgba(255,200,210,.25);border-radius:0 10px 10px 10px;padding:20px 28px;min-height:130px;backdrop-filter:blur(12px);position:relative}
#tx{color:#e8e8f0;font-size:18px;line-height:1.8;min-height:54px}
#ind{position:absolute;bottom:10px;right:20px;color:rgba(255,255,255,.5);font-size:13px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#e{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;background:rgba(0,0,0,.7)}
#e h2{font-family:'Noto Serif SC',serif;font-size:36px;color:#ffd0dc;margin-bottom:20px}
@media(max-width:768px){#t h1{font-size:32px}#tx{font-size:15px}#tg{font-size:14px;padding:4px 20px}#bx{padding:14px 18px;min-height:110px}.btn{padding:10px 36px;font-size:16px}}
</style>
</head>
<body>
<div id="game">
  <div id="t" class="l">
    <h1>菊厂恋爱物语</h1>
    <div class="sub">HW Love Story</div>
    <button class="btn" id="start-btn">开 始 游 戏</button>
  </div>
    <div id="m" class="l h"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#080c16"><svg id="china-svg" viewBox="0 0 780 600">
<style>.prov{fill:#1a2840;stroke:#3a5070;stroke-width:1.5}.prov:hover{fill:#253550}.city{cursor:pointer;transition:transform .25s}.city:hover{transform:scale(1.25)}.dot{fill:#ff4444;stroke:#fff;stroke-width:2.5}.lbl{fill:#ff6b6b;font-size:15px;font-weight:700;pointer-events:none}.ring{fill:none;stroke:#ff4444;stroke-width:2;opacity:.5}</style>
<g class="prov"><path d="M680,42 L695,22 L715,20 L730,36 L720,55 L738,68 L728,85 L710,100 L720,115 L700,130 L692,155 L706,170 L696,190 L710,210 L700,230 L715,248 L705,265 L720,280 L710,300 L725,318 L715,335 L730,352 L720,368 L738,385 L725,400 L742,415 L730,430 L748,445 L735,460 L752,475 L740,490 L755,505 L745,520 L760,535 L440,545 L420,530 L380,540 L370,525 L330,535 L320,520 L285,528 L275,512 L240,520 L230,505 L200,510 L190,495 L160,500 L148,485 L120,490 L108,475 L85,480 L72,465 L55,468 L42,450 L55,432 L80,425 L90,408 L115,398 L135,380 L155,370 L165,348 L185,340 L200,320 L220,310 L240,295 L260,288 L280,270 L300,260 L320,245 L340,232 L360,220 L385,210 L410,198 L435,190 L460,178 L485,168 L510,158 L535,150 L560,140 L585,132 L610,122 L635,112 L660,98 L670,82 L680,62 L682,42 Z"/></g>
<g class="city" data-city="beijing">
  <circle class="ring" cx="560" cy="165" r="18"/>
  <circle class="dot" cx="560" cy="165" r="9"/>
  <text class="lbl" x="578" y="170">北京</text>
</g>
<g class="city" data-city="shenzhen">
  <circle class="ring" cx="472" cy="430" r="18"/>
  <circle class="dot" cx="472" cy="430" r="9"/>
  <text class="lbl" x="490" y="435">深圳</text>
</g>
</svg></div><div id="ov" class="ov"><p id="ov-msg"></p><button class="btn" id="ov-yes" style="padding:10px 28px;font-size:15px;margin-right:8px">出发</button><button class="btn" id="ov-no" style="padding:10px 28px;font-size:15px">再想想</button></div></div>
  </div>
</div>
  <div id="d" class="l h">
    <div id="tg"></div>
    <div id="bx">
      <div id="tx"></div>
      <div id="ind">&#x25BC; 点击继续</div>
    </div>
  </div>
  <div id="e" class="l h">
    <h2>未完待续</h2>
    <button class="btn" id="back-btn" style="padding:10px 36px;font-size:16px">返回地图</button>
  </div>
</div>
<script>
var g=function(id){return document.getElementById(id)}
var L={t:g('t'),m:g('m'),d:g('d'),e:g('e'),tg:g('tg'),tx:g('tx'),ind:g('ind'),ov:g('ov'),ovm:g('ov-msg'),bx:g('bx')}
var city='',scene=0,line=0,typing=false,timer=null

var stories={
  beijing:{name:'嫣儿',title:'北京',lines:[
    {w:'',t:'高铁缓缓驶入北京南站，窗外的城市轮廓在晨光中逐渐清晰。'},
    {w:'',t:'松山湖的日子仿佛还在昨天，但新的篇章已经翻开。'},
    {w:'',t:'按照入职指引的地址，你拖着行李箱走进了北京的研发中心。'},
    {w:'???',t:'你就是新来的同事吧？'},
    {w:'',t:'一个扎着马尾的女孩从工位站起来，朝你挥了挥手。'},
    {w:'嫣儿',t:'你好呀，我叫嫣儿。以后就是同事了，多多关照~'},
  ]},
  shenzhen:{name:'虚叶',title:'深圳',lines:[
    {w:'',t:'飞机降落在宝安机场，潮湿的暖风扑面而来。'},
    {w:'',t:'深圳，这座永远在奔跑的城市，你深吸一口气，走向出口。'},
    {w:'',t:'研发大楼的灯还亮着，已是深夜十一点。'},
    {w:'???',t:'这么晚才到？'},
    {w:'',t:'一个戴着黑框眼镜的女生从茶水间走出来，手里端着咖啡。'},
    {w:'虚叶',t:'我叫虚叶，等你半天了。这边工位都给你收拾好了，先坐下歇会吧。'},
  ]}
}

g('start-btn').addEventListener('click',function(){L.t.classList.add('h');setTimeout(function(){L.m.classList.remove('h')},400)})

document.querySelectorAll('#china-svg .city').forEach(function(el){el.addEventListener('click',function(){pick(el.dataset.city)})})})})

function pick(c){city=c;document.querySelectorAll('.city').forEach(function(e){e.classList.remove('on')});L.ovm.textContent='出发去'+stories[c].title+'？';L.ov.classList.add('on')}
g('ov-yes').addEventListener('click',function(){L.ov.classList.remove('on');scene=0;line=0;typing=false;L.m.classList.add('h');L.d.classList.remove('h');nxt()})
g('ov-no').addEventListener('click',function(){L.ov.classList.remove('on');document.querySelectorAll('.city').forEach(function(e){e.classList.remove('on')})})

function nxt(){var s=stories[city];if(line>=s.lines.length){fin();return}var l=s.lines[line];line++;if(l.w){L.tg.textContent=l.w;L.tg.classList.add('s')}else{L.tg.classList.remove('s')}L.ind.style.display='none';type(l.t,function(){L.ind.style.display='block'})}
function type(t,cb){typing=true;if(timer)clearTimeout(timer);L.tx.textContent='';var i=0;function tick(){if(i<t.length){L.tx.textContent+=t[i];i++;timer=setTimeout(tick,35)}else{typing=false;timer=null;if(cb)cb()}}tick()}
function fin(){L.d.classList.add('h');L.e.classList.remove('h')}
g('back-btn').addEventListener('click',function(){L.e.classList.add('h');L.m.classList.remove('h');city='';scene=0;line=0})
L.bx.addEventListener('click',function(){if(typing){typing=false;clearTimeout(timer);timer=null;return}nxt()})
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();L.bx.click()}})
</script>
</body>
</html>
