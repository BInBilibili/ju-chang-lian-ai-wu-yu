<style>

  #ending-screen .ending-type { font-size: 14px; color: rgba(200, 170, 190, 0.5); letter-spacing: 0.2em; margin-bottom: 36px; }

  #restart-btn:hover { background: rgba(255, 180, 200, 0.12); border-color: rgba(255, 200, 210, 0.7); }
  @media (max-width: 768px) { #game { max-height: 100vh; } #char-canvas { width: 300px; height: 400px; margin-bottom: 110px; } #dialogue-text { font-size: 15px; } #name-tag { font-size: 14px; padding: 4px 20px; } #dialogue-box { padding: 14px 18px; min-height: 110px; } #title-screen h1 { font-size: 32px; } .choice-btn { font-size: 15px; padding: 12px 34px; min-width: 220px; } }
</style>
</head>

<div id="game">

<script>(function drawBackground(){var c=document.getElementById("bg-canvas");var ctx=c.getContext("2d");var W=1280,H=720;function resize(){var s=Math.max(c.parentElement.clientWidth/W,c.parentElement.clientHeight/H);c.width=W;c.height=H}resize();window.addEventListener("resize",resize);var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#0a0a1e");sky.addColorStop(0.3,"#12183a");sky.addColorStop(0.5,"#1a2450");sky.addColorStop(0.7,"#1e3060");sky.addColorStop(0.85,"#243868");sky.addColorStop(1,"#2a4068");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);var stars=[[120,45],[340,32],[560,60],[780,25],[950,55],[1080,40],[200,80],[890,70],[1050,15],[420,50],[650,38],[70,90],[300,20],[500,75],[750,15],[900,30],[1150,50]];stars.forEach(function(s){ctx.globalAlpha=0.4+Math.random()*0.5;ctx.beginPath();ctx.arc(s[0],s[1],1.2,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;var blds=[[0,280],[60,240],[140,270],[200,220],[280,260],[350,200],[430,250],[500,210],[580,270],[660,230],[740,260],[820,200],[900,250],[980,220],[1060,270],[1140,240]];blds.forEach(function(b,i){var w=75+(i%3)*15;var h=H*0.7-b[1];ctx.fillStyle="#0a0e20";ctx.fillRect(b[0],b[1],w+10,h);ctx.fillStyle="#0f1430";ctx.fillRect(b[0],b[1],w+10,20);for(var wy=b[1]+30;wy<b[1]+h-15;wy+=28){for(var wx=b[0]+10;wx<b[0]+w-5;wx+=22){if(Math.random()>0.4){ctx.fillStyle="rgba(180,210,255,"+(0.15+Math.random()*0.35)+")";ctx.fillRect(wx,wy,14,16)}}}});var ground=ctx.createLinearGradient(0,H*0.65,0,H);ground.addColorStop(0,"#0d1025");ground.addColorStop(0.5,"#0a0c1e");ground.addColorStop(1,"#060812");ctx.fillStyle=ground;ctx.fillRect(0,H*0.65,W,H*0.35);for(var lx=80;lx<W;lx+=200){var glow=ctx.createRadialGradient(lx,H*0.5,10,lx,H*0.65,120);glow.addColorStop(0,"rgba(255,220,180,0.15)");glow.addColorStop(0.5,"rgba(255,200,150,0.05)");glow.addColorStop(1,"rgba(255,180,120,0)");ctx.fillStyle=glow;ctx.fillRect(lx-120,H*0.4,240,H*0.35)}var redG=ctx.createRadialGradient(W*0.75,H*0.45,5,W*0.75,H*0.6,200);redG.addColorStop(0,"rgba(200,50,5 function drawCharacter(expression) {
  var c = document.getElementById("char-canvas");
  var ctx = c.getContext("2d");
  var W = 480, H = 640;
  c.width = W; c.height = H;
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2;
  ctx.fillStyle = "#2c1a3a";
  ctx.beginPath();
  ctx.moveTo(cx - 90, 30);
  ctx.quadraticCurveTo(cx - 120, 200, cx - 100, 420);
  ctx.quadraticCurveTo(cx - 70, 520, cx - 40, 540);
  ctx.lineTo(cx + 40, 540);
  ctx.quadraticCurveTo(cx + 70, 520, cx + 100, 420);
  ctx.quadraticCurveTo(cx + 120, 200, cx + 90, 30);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3d2650";
  ctx.beginPath();
  ctx.moveTo(cx - 60, 60);
  ctx.quadraticCurveTo(cx - 80, 250, cx - 60, 400);
  ctx.quadraticCurveTo(cx - 40, 500, cx - 20, 520);
  ctx.lineTo(cx + 10, 520);
  ctx.quadraticCurveTo(cx, 480, cx - 20, 350);
  ctx.quadraticCurveTo(cx - 10, 200, cx - 30, 60);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f5f0f8";
  ctx.beginPath();
  ctx.moveTo(cx - 70, 220);
  ctx.quadraticCurveTo(cx - 30, 210, cx, 240);
  ctx.quadraticCurveTo(cx + 30, 210, cx + 70, 220);
  ctx.quadraticCurveTo(cx + 90, 380, cx + 80, 540);
  ctx.lineTo(cx - 80, 540);
  ctx.quadraticCurveTo(cx - 90, 380, cx - 70, 220);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f5f0f8";
  ctx.beginPath();
  ctx.moveTo(cx - 25, 220);
  ctx.quadraticCurveTo(cx - 5, 210, cx, 230);
  ctx.quadraticCurveTo(cx + 5, 210, cx + 25, 220);
  ctx.lineTo(cx + 35, 265);
  ctx.lineTo(cx, 255);
  ctx.lineTo(cx - 35, 265);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c44555";
  ctx.beginPath();
  ctx.moveTo(cx - 12, 248);
  ctx.quadraticCurveTo(cx, 244, cx + 12, 248);
  ctx.quadraticCurveTo(cx + 15, 258, cx + 10, 262);
  ctx.quadraticCurveTo(cx, 266, cx - 10, 262);
  ctx.quadraticCurveTo(cx - 15, 258, cx - 12, 248);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "6px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("HW", cx, 258);
  ctx.fillStyle = "#1a2238";
  ctx.beginPath();
  ctx.moveTo(cx - 55, 340);
  ctx.quadraticCurveTo(cx - 35, 335, cx, 340);
  ctx.quadraticCurveTo(cx + 35, 335, cx + 55, 340);
  ctx.quadraticCurveTo(cx + 70, 480, cx + 65, 540);
  ctx.lineTo(cx - 65, 540);
  ctx.quadraticCurveTo(cx - 70, 480, cx - 55, 340);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f5f0f8";
  ctx.beginPath(); ctx.ellipse(cx - 100, 380, 22, 80, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 100, 380, 22, 80, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fce4dc";
  ctx.beginPath();
  ctx.moveTo(cx - 16, 200);
  ctx.quadraticCurveTo(cx - 14, 220, cx - 12, 230);
  ctx.lineTo(cx + 12, 230);
  ctx.quadraticCurveTo(cx + 14, 220, cx + 16, 200);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fce4dc";
  ctx.beginPath();
  ctx.moveTo(cx - 75, 160);
  ctx.quadraticCurveTo(cx - 80, 130, cx - 65, 100);
  ctx.quadraticCurveTo(cx - 35, 35, cx, 30);
  ctx.quadraticCurveTo(cx + 35, 35, cx + 65, 100);
  ctx.quadraticCurveTo(cx + 80, 130, cx + 75, 160);
  ctx.quadraticCurveTo(cx + 70, 190, cx + 30, 210);
  ctx.quadraticCurveTo(cx, 220, cx - 30, 210);
  ctx.quadraticCurveTo(cx - 70, 190, cx - 75, 160);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(230, 190, 175, 0.3)";
  ctx.beginPath();
  ctx.moveTo(cx - 50, 180);
  ctx.quadraticCurveTo(cx - 60, 165, cx - 55, 140);
  ctx.quadraticCurveTo(cx - 25, 160, cx - 15, 180);
  ctx.quadraticCurveTo(cx - 25, 190, cx - 50, 180);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 50, 180);
  ctx.quadraticCurveTo(cx + 60, 165, cx + 55, 140);
  ctx.quadraticCurveTo(cx + 25, 160, cx + 15, 180);
  ctx.quadraticCurveTo(cx + 25, 190, cx + 50, 180);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2c1a3a";
  ctx.beginPath();
  ctx.moveTo(cx - 70, 140);

  ctx.quadraticCurveTo(cx - 30, 30, cx, 25);
  ctx.lineTo(cx, 70); ctx.lineTo(cx - 60, 120);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 70, 140);
  ctx.quadraticCurveTo(cx + 80, 110, cx + 50, 50);
  ctx.quadraticCurveTo(cx + 30, 30, cx, 25);
  ctx.lineTo(cx, 70); ctx.lineTo(cx + 60, 120);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 35, 50);
  ctx.quadraticCurveTo(cx - 15, 20, cx, 15);
  ctx.quadraticCurveTo(cx + 15, 20, cx + 35, 50);
  ctx.lineTo(cx + 20, 60);
  ctx.quadraticCurveTo(cx, 45, cx - 20, 60);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 55, 90);
  ctx.quadraticCurveTo(cx - 50, 65, cx - 25, 55);
  ctx.lineTo(cx - 15, 75); ctx.lineTo(cx - 45, 100);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 55, 90);
  ctx.quadraticCurveTo(cx + 50, 65, cx + 25, 55);
  ctx.lineTo(cx + 15, 75); ctx.lineTo(cx + 45, 100);
  ctx.closePath(); ctx.fill();
  function drawEye(ex, ey) {
    ctx.fillStyle = "#fff";

    ctx.ellipse(ex, ey, 18, 22, 0, Math.PI, 0);

    ctx.lineWidth = 1.2;

    ctx.moveTo(ex - 16, ey + 8);

    ctx.beginPath();
    ctx.moveTo(cx - 8, 175); ctx.quadraticCurveTo(cx, 184, cx + 8, 175);
    ctx.stroke();
  }
  ctx.fillStyle = "#8899bb";
  ctx.beginPath(); ctx.arc(cx + 55, 70, 6, 0, Math.PI * 2); ctx.fill();
}

        { speaker: "小菊", text: "……谢谢你帮忙。" },
        { speaker: "小菊", text: "其实这个bug我已经看了三个晚上了，一直不好意思找别人问。" },
      ],
      charExpr: "happy",
      next: "choice3",
    },
    scene3b: {
      lines: [
        { speaker: "小菊", text: "咖啡……？" },
        { speaker: "", text: "她愣了一下，然后看了眼时间——凌晨一点半。" },
        { speaker: "小菊", text: "确实该休息一下了。这个bug不会跑的，但人会。" },
        { speaker: "", text: "她轻轻笑了笑，保存了代码，从工位上站起来。" },
        { speaker: "小菊", text: "有时候盯着屏幕太久，反而看不到问题在哪。" },

      options: [

        { text: "「不早了，我先下班了」", next: "ending_neutral" },

    },
    ending_good: {
      lines: [
        { speaker: "小菊", text: "……！" },
        { speaker: "", text: "她转过头看着我，眼睛里映着屏幕的微光。" },
        { speaker: "小菊", text: "当然好啊！明天我请你喝咖啡！" },
        { speaker: "小菊", text: "那就说定了，明天晚上，还是这个工位——" },
        { speaker: "", text: "她笑了，是那种程序员特有的、熬夜熬出来的、但发自内心的笑。" },
        { speaker: "", text: "松山湖的夜还很长，但有些东西，比bug更值得熬夜去修。" },
      ],
      charExpr: "happy",
      next: null,
      ending: {
        title: "约定",
        type: "✦ TRUE ENDING ✦",
        text: "那个凌晨的工位，成了你们两个人的秘密。\n从此以后，每个加班的夜晚，都不再是一个人。",

    ending_neutral: {
      lines: [
        { speaker: "小菊", text: "嗯，明天见。" },

        { speaker: "", text: "走廊很长，灯光把影子拉得很远。我回头看了一次，她的屏幕还亮着。" },
        { speaker: "", text: "但那天晚上的梦里，我好像又听到了那个窗口跳动的光标。" },
      ],
      charExpr: null,
      next: null,
      ending: {
        title: "余音",
        type: "✦ NORMAL ENDING ✦",
        text: "你记住了那个工位的位置，却没有再回去过。\n有些bug注定要被留在某个加班的夜晚。",

};

var game = {
  currentScene: null, currentLineIdx: 0,
  isTyping: false, typeTimer: null,
  inChoice: false, ended: false,
};

function $(sel) { return document.querySelector(sel); }
var nameTag = $("#name-tag");
var dialogueText = $("#dialogue-text");
var clickIndicator = $("#click-indicator");
var choicesLayer = $("#choices-layer");
var charCanvas = $("#char-canvas");
var titleScreen = $("#title-screen");
var endingScreen = $("#ending-screen");

function setCharacter(expr) {
  if (expr) { charCanvas.classList.remove("hidden-char"); drawCharacter(expr); }
  else { charCanvas.classList.add("hidden-char"); }
}

function startScene(sceneId) {
  game.currentScene = sceneId; game.currentLineIdx = 0;
  game.inChoice = false; hideChoices(); advanceScene();
}

function advanceScene() {
  var scene = story.scenes[game.currentScene];
  if (!scene) return;
  if (scene.type === "choice") { showChoices(scene); return; }
  if (game.currentLineIdx >= scene.lines.length) {
    if (scene.ending) { showEnding(scene.ending); }
    else if (scene.next) { startScene(scene.next); }
    return;
  }
  if (scene.charExpr !== undefined) { setCharacter(scene.charExpr); }
  var line = scene.lines[game.currentLineIdx];
  showLine(line); game.currentLineIdx++;
}

function showLine(line) {
  if (line.speaker) { nameTag.textContent = line.speaker; nameTag.classList.remove("hidden-tag"); }
  else { nameTag.classList.add("hidden-tag"); }
  clickIndicator.style.display = "none";
  typeText(line.text, function() { clickIndicator.style.display = "block"; });
}

function typeText(text, callback) {
  game.isTyping = true;
  if (game.typeTimer) clearTimeout(game.typeTimer);
  dialogueText.textContent = "";
  var i = 0, speed = 40;
  function tick() {
    if (i < text.length) { dialogueText.textContent += text[i]; i++; game.typeTimer = setTimeout(tick, speed); }
    else { game.isTyping = false; game.typeTimer = null; if (callback) callback(); }
  }
  tick();
}

function showChoices(scene) {
  game.inChoice = true; choicesLayer.innerHTML = ""; choicesLayer.classList.add("active");
  scene.options.forEach(function(opt, idx) {
    var btn = document.createElement("button");
    btn.className = "choice-btn"; btn.textContent = opt.text;
    btn.addEventListener("click", function() { if (game.inChoice) chooseOption(scene, idx); });
    choicesLayer.appendChild(btn);
    setTimeout(function() { btn.classList.add("show"); }, idx * 120);
  });
}

function hideChoices() { game.inChoice = false; choicesLayer.classList.remove("active"); }

function chooseOption(scene, idx) { hideChoices(); startScene(scene.options[idx].next); }

function showEnding(ending) {
  game.ended = true;
  $("#ending-title").textContent = ending.title;
  $("#ending-type").textContent = ending.type;
  $("#ending-text").textContent = ending.text;
  endingScreen.classList.add("show");
}

function restart() {
  game.ended = false; game.currentScene = null; game.currentLineIdx = 0;
  game.isTyping = false; game.inChoice = false;
  if (game.typeTimer) clearTimeout(game.typeTimer);
  dialogueText.textContent = ""; nameTag.classList.add("hidden-tag");
  setCharacter(null); hideChoices();
  endingScreen.classList.remove("show"); titleScreen.classList.remove("hidden");
}

$("#start-btn").addEventListener("click", function() {
  titleScreen.classList.add("hidden");
  setTimeout(function() { startScene(story.start); }, 400);
});

$("#restart-btn").addEventListener("click", restart);

$("#dialogue-box").addEventListener("click", function() {
  if (game.ended || game.inChoice) return;
  if (game.isTyping) {
    if (game.typeTimer) clearTimeout(game.typeTimer);
    game.isTyping = false; game.typeTimer = null;
    var scene = story.scenes[game.currentScene];
    if (scene && game.currentLineIdx > 0) { dialogueText.textContent = scene.lines[game.currentLineIdx - 1].text; }
    clickIndicator.style.display = "block";
    return;
  }
  advanceScene();
});

document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (game.ended || game.inChoice) return;
    $("#dialogue-box").click();
  }
});

setCharacter(null);
</script>
</body>
